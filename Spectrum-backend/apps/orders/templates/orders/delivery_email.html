<!doctype html>
<html><body style="margin:0;background:#221F29;font-family:Arial,sans-serif;color:#F6F4F1">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" style="max-width:520px;background:#1C1A22;border-radius:16px" cellpadding="0" cellspacing="0">
      <tr><td style="height:4px;background:linear-gradient(90deg,#FFC93C,#FF8A3D,#E8503A,#2FBF8F,#7C4DE0,#D6339A);border-radius:16px 16px 0 0"></td></tr>
      <tr><td style="padding:32px">
        <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-size:26px;font-weight:normal">Your memories are here.</h1>
        <p style="margin:0 0 20px;color:#C3BEC9;font-size:15px;line-height:1.5">
          Hi {{ order.name }}, your {{ count }} full-resolution photo{{ count|pluralize }} from
          <strong style="color:#F6F4F1">{{ event.name }}</strong> ({{ event.institution.name }}) are ready.
        </p>
        <a href="{{ link }}" style="display:inline-block;background:#7C4DE0;color:#fff;text-decoration:none;padding:14px 28px;border-radius:999px;font-weight:bold">Download your photos</a>
        <p style="margin:24px 0 0;color:#C3BEC9;font-size:12px">The link does not expire. Order {{ order.public_id }}.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body></html>
