<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ heading }} — Spectrum</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      background: #221F29; color: #F6F4F1; font-family: Arial, Helvetica, sans-serif; }
    .card { width: 100%; max-width: 480px; background: #1C1A22; border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
    .bar { height: 4px; background: linear-gradient(90deg, #FFC93C, #FF8A3D, #E8503A, #2FBF8F, #7C4DE0, #D6339A); }
    .inner { padding: 32px; }
    h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 26px; font-weight: normal; }
    p { margin: 0 0 16px; color: #C3BEC9; font-size: 15px; line-height: 1.55; }
    .file { margin: 0 0 20px; padding: 14px 16px; border: 1px solid #3a3644; border-radius: 12px; color: #F6F4F1; }
    .file small { display: block; margin-top: 4px; color: #C3BEC9; }
    button { width: 100%; padding: 15px; border: 0; border-radius: 999px; background: #7C4DE0; color: #fff;
      font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover, button:focus { background: #6a3fcc; }
    button[disabled] { opacity: .6; cursor: default; }
    .meta { margin: 20px 0 0; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <div class="inner">
      <h1>{{ heading }}</h1>
      <p>{{ body }}</p>
      {% if button %}
        <div class="file">{{ title }}{% if size %}<small>{{ size }}</small>{% endif %}</div>
        {# A POST, so link scanners and chat previews, which only open links, never use it up. #}
        <form method="post" onsubmit="this.querySelector('button').disabled = true; this.querySelector('button').textContent = 'Starting download…';">
          <button type="submit">Download</button>
        </form>
      {% endif %}
      {% if order %}<p class="meta">Order {{ order.public_id }} · {{ order.event.name }}</p>{% endif %}
    </div>
  </main>
</body>
</html>
