# /etc/nginx/sites-available/spectrum-api  (add TLS with certbot --nginx)
server {
    listen 80;
    server_name api.spectrum.in;

    # Admin uploads. Event videos arrive as one form POST and can run to many
    # gigabytes; nginx buffers the body to disk first, so the partition holding
    # client_body_temp_path needs that much free space.
    client_max_body_size 12g;
    client_body_timeout 30m;

    location /static/ {
        alias /srv/spectrum/Spectrum-backend/var/static/;
        expires 30d;
        access_log off;
    }

    # Public image variants (only when USE_S3=0). Originals in media/private are never exposed.
    location /media/public/ {
        alias /srv/spectrum/media/public/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Paid downloads: Django checks the token, then hands the file to nginx (X-Accel-Redirect).
    location /_private/ {
        internal;
        alias /srv/spectrum/media/private/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # The app trusts X-Real-IP only. Behind Cloudflare, use set_real_ip_from + real_ip_header CF-Connecting-IP first.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for a multi-GB video to be forwarded and pushed to S3.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }
}
